# A TOML plugin for proto: https://moonrepo.dev/docs/proto/plugins#toml-plugin
name = "humanlog"
type = "cli"

[platform.linux]
download-file = "humanlog_{version}_linux_{arch}.tar.gz"

[platform.macos]
download-file = "humanlog_{version}_darwin_{arch}.tar.gz"

[install]
download-url = "https://github.com/humanlogio/humanlog/releases/download/v{version}/{download_file}"
checksum-url = "https://github.com/humanlogio/humanlog/releases/download/v{version}/checksums.txt"
unpack = true

[install.arch]
aarch64 = "arm64"
x86_64 = "amd64"

[resolve]
git-url = "https://github.com/humanlogio/humanlog"
