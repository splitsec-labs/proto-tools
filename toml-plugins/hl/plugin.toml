# A TOML plugin for proto: https://moonrepo.dev/docs/proto/plugins#toml-plugin
name = "hl"
type = "cli"

[platform.linux]
download-file = "hl-linux-{arch}-gnu.tar.gz"

[platform.macos]
download-file = "hl-macos-{arch}.tar.gz"

[install]
download-url = "https://github.com/pamburus/hl/releases/download/v{version}/{download_file}"
unpack = true

[install.arch]
aarch64 = "arm64"
x86_64 = "x86_64"

[resolve]
git-url = "https://github.com/pamburus/hl"
